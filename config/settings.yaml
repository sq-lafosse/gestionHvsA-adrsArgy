# Model and pipeline parameters.
# All paths are relative to the project root.

# Technical signal windows (weeks)
sma_short:        20
sma_long:         30
momentum_window:  12
vol_window:       12

# Regime classifier
model_path: "data/cache/models/regime_pipeline.joblib"

# NLP
news_base_dir: "data/news"

# Outputs
results_base_dir: "results"

# Logging
log_level: "INFO"
log_dir:   "logs"

# Dynamic allocation formula weights (must sum to 1.0)
allocation_weights:
  signal_weight:      0.40
  vol_weight:         0.30
  corr_weight:        0.10
  nlp_company_weight: 0.10
  nlp_macro_weight:   0.10
